# The RubyGems trusted publisher is registered to this filename (push_gem.yml).

name: Push Gem

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-check:
    name: Release check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler: none
          ruby-version: ruby

      - name: Check version and changelog
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: ruby .github/scripts/release.rb check

      - name: Build gem
        run: gem build ruby-proxy-headers.gemspec

  lookup:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the release pull request
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pulls="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"
          mapfile -t refs < <(
            jq -r --arg repo "$GITHUB_REPOSITORY" '
              .[]
              | select(
                  .base.ref == "main"
                  and .merged_at != null
                  and (.head.ref | test("^release/[0-9]+\\.[0-9]+\\.[0-9]+$"))
                  and .head.repo.full_name == $repo
                )
              | .head.ref
            ' <<<"$pulls"
          )
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "Not a release merge."
            exit 0
          fi
          if [ "${#refs[@]}" -ne 1 ]; then
            echo "This commit matches more than one release pull request." >&2
            exit 1
          fi
          version="${refs[0]#release/}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  publish:
    needs: lookup
    if: needs.lookup.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler: none
          ruby-version: ruby

      - name: Check version and changelog
        env:
          HEAD_REF: release/${{ needs.lookup.outputs.version }}
        run: ruby .github/scripts/release.rb check

      - name: Build gem
        run: gem build ruby-proxy-headers.gemspec

      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push gem
        env:
          VERSION: ${{ needs.lookup.outputs.version }}
        run: gem push "ruby-proxy-headers-${VERSION}.gem"

  github-release:
    needs: [lookup, publish]
    if: needs.lookup.outputs.version != '' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler: none
          ruby-version: ruby

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.lookup.outputs.version }}
        run: |
          set -euo pipefail
          ruby .github/scripts/release.rb notes "${VERSION}" > "${RUNNER_TEMP}/notes.md"
          gh release view "v${VERSION}" \
            || gh release create "v${VERSION}" \
              --target "$GITHUB_SHA" \
              --title "v${VERSION}" \
              --notes-file "${RUNNER_TEMP}/notes.md"

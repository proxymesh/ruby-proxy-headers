# The RubyGems trusted publisher is registered to this filename (push_gem.yml).
# Pull requests run the release check. Merging release/X.Y.Z publishes the gem,
# then tags vX.Y.Z and opens the GitHub Release. The publish job uses the
# GitHub environment "release".

name: Push Gem

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -sSfL -o "${archive}" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          bundler: none
          ruby-version: ruby

      - name: Build gem
        run: gem build ruby-proxy-headers.gemspec

      - name: Check version manifests and gem
        run: |
          set -euo pipefail
          gems=(ruby-proxy-headers-*.gem)
          ruby .github/scripts/release.rb check --gem "${gems[0]}"

      - name: Check release branch
        run: ruby .github/scripts/release.rb check-branch

  gate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      sha: ${{ steps.decide.outputs.sha }}
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: ruby .github/scripts/release.rb gate

  publish:
    needs: gate
    if: >-
      needs.gate.result == 'success' &&
      needs.gate.outputs.publish == 'true' &&
      github.repository == 'proxymesh/ruby-proxy-headers'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          bundler: none
          ruby-version: ruby

      - name: Check version
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: ruby .github/scripts/release.rb check --version "${VERSION}"

      - name: Plan
        id: plan
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          MODE: ${{ needs.gate.outputs.mode }}
          TARGET_SHA: ${{ needs.gate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: ruby .github/scripts/release.rb plan

      - name: Build gem
        if: steps.plan.outputs.action == 'push'
        run: gem build ruby-proxy-headers.gemspec

      - name: Configure RubyGems credentials
        if: steps.plan.outputs.action == 'push'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push gem
        if: steps.plan.outputs.action == 'push'
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: ruby .github/scripts/release.rb push-gem

      - name: Create GitHub Release
        if: steps.plan.outputs.create_release == 'true'
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          TARGET_SHA: ${{ needs.gate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: ruby .github/scripts/release.rb github-release

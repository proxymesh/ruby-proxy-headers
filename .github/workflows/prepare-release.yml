# Opens a release/X.Y.Z pull request. Does not merge it.
# A pull request opened with GITHUB_TOKEN does not run pull_request workflows,
# so this job runs the release checks before it pushes.

name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: X.Y.Z, patch, minor, or major
        required: true
        type: string

permissions: {}

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require main
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Run Prepare release from main." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler: none
          ruby-version: ruby

      - name: Bump version and changelog
        id: bump
        env:
          RELEASE_SPEC: ${{ inputs.version }}
        run: ruby .github/scripts/release.rb bump "${RELEASE_SPEC}"

      - name: Check version files
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          file_version="$(ruby -r ./lib/ruby_proxy_headers/version.rb -e 'puts RubyProxyHeaders::VERSION')"
          if [[ "${VERSION}" != "${file_version}" ]]; then
            echo "bumped ${VERSION} but version.rb is ${file_version}" >&2
            exit 1
          fi
          lock="$(grep -E '^[[:space:]]*ruby-proxy-headers \([0-9]+\.[0-9]+\.[0-9]+\)' Gemfile.lock || true)"
          if [[ -z "${lock}" ]] || grep -v "ruby-proxy-headers (${VERSION})" <<<"${lock}" | grep -q .; then
            echo "Gemfile.lock does not match ${VERSION}" >&2
            exit 1
          fi

      - name: Check changelog
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: ruby .github/scripts/release.rb notes "${VERSION}" >/dev/null

      - name: Build gem
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          gem build ruby-proxy-headers.gemspec
          test -f "ruby-proxy-headers-${VERSION}.gem"

      - name: Push release branch
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          branch="release/${VERSION}"
          if git ls-remote --exit-code origin "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "Branch ${branch} already exists." >&2
            exit 1
          fi
          git checkout -b "${branch}"
          git add lib/ruby_proxy_headers/version.rb Gemfile.lock CHANGELOG.md
          git commit -m "Release ${VERSION}"
          git push origin "HEAD:${branch}"

      - name: Open pull request
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ruby .github/scripts/release.rb notes "${VERSION}" > "${RUNNER_TEMP}/notes.md"
          gh pr create \
            --base main \
            --head "release/${VERSION}" \
            --title "Release ${VERSION}" \
            --body-file "${RUNNER_TEMP}/notes.md"
